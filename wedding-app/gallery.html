<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse and share photos from Priya & Sanjay's wedding." />
  <title>Photos · Priya &amp; Sanjay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <section class="subhero">
      <p class="subhero__kicker" data-i18n="sub.gallery.kicker">A shared album</p>
      <h1 data-i18n="title.gallery">Photos</h1>
      <p data-i18n="sub.gallery.intro">Captured a moment over the weekend? Share it here so everyone can relive it.</p>
    </section>

    <section class="section">
      <div class="share reveal" id="share">
        <h3>📸 Share your photos</h3>
        <p>Add a snap from any of the events — it'll appear in the gallery below.</p>
        <form class="share__form" id="photoForm">
          <div class="share__row">
            <input type="text" name="uploader" placeholder="Your name (optional)" autocomplete="name" />
            <input type="text" name="caption" placeholder="Caption (optional)" maxlength="200" />
          </div>
          <div class="share__row share__cam">
            <input type="file" name="photo" id="photoInput" accept="image/*" required />
            <button type="submit" class="btn btn--solid btn--sm">Upload photo</button>
            <button type="button" class="btn btn--outline btn--sm" id="cameraBtn">📷 Take a photo</button>
          </div>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
          <p class="share__status" id="photoStatus" role="status" aria-live="polite"></p>
        </form>
      </div>

      <div class="gallery" id="galleryGrid" style="margin-top:2.5rem"></div>
      <p class="guestbook__empty" id="galleryEmpty" hidden>No photos yet — be the first to share one!</p>
    </section>
  </main>
  <div id="site-footer"></div>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox__close" aria-label="Close">&times;</button>
    <div class="lightbox__stage" id="lightboxStage"></div>
  </div>

  <script src="js/site.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
