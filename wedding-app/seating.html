<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Find your table for Priya & Sanjay's reception." />
  <title>Find Your Seat · Priya &amp; Sanjay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <section class="subhero">
      <p class="subhero__kicker" data-i18n="sub.seating.kicker">At the reception</p>
      <h1 data-i18n="title.seating">Find Your Seat</h1>
      <p data-i18n="sub.seating.intro">Enter your name to find your table for the reception dinner.</p>
    </section>

    <section class="section">
      <div class="seat">
        <form class="seat__form" id="seatForm">
          <label class="field"><span data-i18n="seat.label">Your name</span>
            <input type="text" name="q" autocomplete="name" placeholder="e.g. Asha Rao" required />
          </label>
          <button type="submit" class="btn btn--solid" data-i18n="seat.find">Find my table</button>
        </form>
        <div class="seat__result" id="seatResult" aria-live="polite"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script src="js/seating.js"></script>
</body>
</html>
