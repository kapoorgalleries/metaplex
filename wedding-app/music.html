<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Request a song for Priya & Sanjay's reception." />
  <title>Song Requests · Priya &amp; Sanjay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <section class="subhero">
      <p class="subhero__kicker" data-i18n="sub.music.kicker">Help us build the playlist</p>
      <h1 data-i18n="title.music">Song Requests</h1>
      <p data-i18n="sub.music.intro">What will get you on the dance floor? Add it to the DJ's list for the Sangeet &amp; Reception.</p>
    </section>

    <section class="section">
      <div class="songs">
        <form class="songs__form" id="songForm">
          <div class="rsvp__row">
            <label class="field"><span>Song <em>*</em></span><input type="text" name="song" required maxlength="120" placeholder="e.g. Kala Chashma" /></label>
            <label class="field"><span>Artist</span><input type="text" name="artist" maxlength="120" placeholder="e.g. Amar Arshi" /></label>
          </div>
          <div class="rsvp__row">
            <label class="field"><span>Your name</span><input type="text" name="by" maxlength="80" autocomplete="name" /></label>
            <label class="field"><span>Dedication (optional)</span><input type="text" name="note" maxlength="200" placeholder="For the bride & groom!" /></label>
          </div>
          <button type="submit" class="btn btn--solid">Add to the playlist</button>
          <p class="rsvp__status" id="songStatus" role="status" aria-live="polite"></p>
        </form>

        <div class="songs__list" id="songList"></div>
        <p class="guestbook__empty" id="songEmpty" hidden>No requests yet — get the party started! 🎶</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script src="js/music.js"></script>
</body>
</html>
