<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="canonical" href="https://priyasanjay.pages.dev/guestbook.html" />

  <meta property="og:site_name" content="Priya & Sanjay 2026" />

  <meta property="og:description" content="Leave a note for Priya & Sanjay in the guestbook." />
  <meta property="og:url" content="https://priyasanjay.pages.dev/guestbook.html" />
  <meta property="og:image" content="https://priyasanjay.pages.dev/assets/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Guestbook · Priya &amp; Sanjay" />
  <meta name="twitter:description" content="Leave a note for Priya & Sanjay in the guestbook." />
  <meta name="twitter:image" content="https://priyasanjay.pages.dev/assets/og.png" />
  <meta name="theme-color" content="#6e1423" />
  <title>Guestbook · Priya &amp; Sanjay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪔</text></svg>" />
</head>
<body>
  <div id="site-header"></div>
  <main class="page">
    <section class="subhero">
      <p class="subhero__kicker" data-i18n="sub.guestbook.kicker">Leave us a note</p>
      <h1 data-i18n="title.guestbook">Guestbook</h1>
      <p data-i18n="sub.guestbook.intro">Share a memory, a blessing, or a bit of advice for married life. We'll treasure every word.</p>
    </section>

    <section class="section">
      <div class="guestbook">
        <form class="guestbook__form" id="guestbookForm">
          <div class="hp" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
          <div class="rsvp__row">
            <label class="field"><span data-i18n-html="gb.name">Your name <em>*</em></span><input type="text" name="name" required autocomplete="name" /></label>
          </div>
          <label class="field"><span data-i18n-html="gb.msg">Your message <em>*</em></span>
            <textarea name="message" rows="4" maxlength="600" required data-i18n-ph="gb.ph" placeholder="Wishing you a lifetime of love and laughter…"></textarea>
          </label>
          <button type="submit" class="btn btn--solid" data-i18n="gb.sign">Sign the guestbook</button>
          <p class="rsvp__status" id="guestbookStatus" role="status" aria-live="polite"></p>
        </form>

        <div class="guestbook__entries" id="guestbookEntries"></div>
        <p class="guestbook__empty" id="guestbookEmpty" hidden data-i18n="gb.empty">No messages yet — be the first to sign! ✍️</p>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="js/site.js"></script>
  <script src="js/guestbook.js"></script>
</body>
</html>
