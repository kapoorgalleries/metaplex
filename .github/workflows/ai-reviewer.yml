name: AI Reviewer Pipeline

# Public repository safety & included-allowance gate:
# - kapoorgalleries/metaplex is public (`private: false`), so `pull_request` /
#   `pull_request_target` triggers are intentionally omitted: untrusted fork PRs
#   must never execute code on a `self-hosted` runner, and GitHub-hosted
#   `ubuntu-latest` runners do not carry `agy` or personal OAuth credentials
#   (paid `GEMINI_API_KEY` and mock/static verdict fallbacks are strictly forbidden).
# - Triggering via `workflow_dispatch` restricts execution to write+ collaborators,
#   checks out only the trusted workflow branch (`scripts/reviewer.js`), and fetches
#   `refs/pull/<pr_number>/head` as inert git objects without checking out PR code.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (fetches refs/pull/<n>/head diff without checking out untrusted PR code)"
        required: false
        type: string
      base_ref:
        description: "Base branch or commit SHA"
        required: false
        default: "master"
        type: string
      head_ref:
        description: "Head ref or commit SHA when pr_number is omitted"
        required: false
        default: "HEAD"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-reviewer-${{ github.workflow }}-${{ inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  report_verdict:
    name: Run AI Reviewer
    # Defaults to `ubuntu-latest` until a runner with `agy` and included-allowance
    # OAuth is explicitly authorized via repository variable `AI_REVIEWER_RUNS_ON`
    # (supports either a JSON array like `["self-hosted","linux","trimurti"]` or a single label).
    runs-on: ${{ (startsWith(vars.AI_REVIEWER_RUNS_ON, '[') && fromJSON(vars.AI_REVIEWER_RUNS_ON)) || vars.AI_REVIEWER_RUNS_ON || 'ubuntu-latest' }}
    # Sized above the 6-chunk review ceiling (40m reviewer deadline < 45m step timeout < 50m job timeout)
    # so multi-chunk runs never cancel the job or skip record_verdict / notify_failure.
    timeout-minutes: 50
    env:
      REVIEW_DIR: /tmp/gemini
    outputs:
      verdict: ${{ steps.record_verdict.outputs.verdict }}
      summary: ${{ steps.record_verdict.outputs.summary }}
      issues_json: ${{ steps.record_verdict.outputs.issues_json }}
    steps:
      # --- Stage 1: checkout & Component 1: Environment & Prerequisites ---
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Prepare environment and prerequisites
        run: |
          set -euo pipefail
          node --version
          git --version

          WORK_DIR="${REVIEW_DIR:-/tmp/gemini}"
          if [ -L "$WORK_DIR" ]; then
            echo "::error::Refusing symlinked REVIEW_DIR: $WORK_DIR"
            exit 1
          fi
          mkdir -p "$WORK_DIR"
          if [ -L "$WORK_DIR" ] || [ ! -d "$WORK_DIR" ] || [ ! -O "$WORK_DIR" ]; then
            echo "::error::Invalid or non-owned REVIEW_DIR directory: $WORK_DIR"
            exit 1
          fi
          chmod 700 "$WORK_DIR"
          for target_file in "$WORK_DIR/pr26.diff" "$WORK_DIR/review_result.json"; do
            if [ -L "$target_file" ]; then
              echo "::error::Refusing symlinked review artifact path: $target_file"
              exit 1
            fi
            rm -f "$target_file"
          done

          for cand_dir in "$HOME/.local/share/agy-native" "$HOME/.local/bin"; do
            if [ -d "$cand_dir" ]; then
              export PATH="$cand_dir:$PATH"
              if [ -n "${GITHUB_PATH:-}" ]; then
                printf '%s\n' "$cand_dir" >> "$GITHUB_PATH"
              fi
            fi
          done

          if [ -n "${REVIEWER_AGY_BIN:-}" ] && [ -x "${REVIEWER_AGY_BIN}" ]; then
            echo "Found configured REVIEWER_AGY_BIN at ${REVIEWER_AGY_BIN}"
          elif [ -n "${AGY_BIN:-}" ] && [ -x "${AGY_BIN}" ]; then
            echo "Found configured AGY_BIN at ${AGY_BIN}"
          elif command -v agy >/dev/null 2>&1; then
            echo "Found agy CLI binary at $(command -v agy)"
          else
            echo "::warning::agy CLI binary is not in PATH; non-empty diffs will fail closed per kg-trimurti-review."
          fi

      - name: Test AI reviewer script
        run: node scripts/test-reviewer.js

      # --- Stage 2: prepare_diff ---
      - name: Generate pull request diff
        env:
          PR_NUMBER: ${{ inputs.pr_number || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          BASE_REF: ${{ inputs.base_ref || github.base_ref || '' }}
          HEAD_REF: ${{ inputs.head_ref || '' }}
        run: |
          set -euo pipefail
          WORK_DIR="${REVIEW_DIR:-/tmp/gemini}"
          if [ -L "$WORK_DIR" ]; then
            echo "::error::Refusing symlinked REVIEW_DIR: $WORK_DIR"
            exit 1
          fi
          mkdir -p "$WORK_DIR"
          if [ -L "$WORK_DIR" ] || [ ! -d "$WORK_DIR" ] || [ ! -O "$WORK_DIR" ]; then
            echo "::error::Invalid or non-owned REVIEW_DIR directory: $WORK_DIR"
            exit 1
          fi
          chmod 700 "$WORK_DIR"
          umask 077
          DIFF_PATH="$WORK_DIR/pr26.diff"
          RESULT_PATH="$WORK_DIR/review_result.json"
          for target_file in "$DIFF_PATH" "$RESULT_PATH"; do
            if [ -L "$target_file" ]; then
              echo "::error::Refusing symlinked review artifact path: $target_file"
              exit 1
            fi
            rm -f "$target_file"
          done

          resolve_git_target() {
            local role="${1:-BASE_REF}"
            local candidate="${2:-}"
            local prefer_origin="${3:-1}"

            if [ -z "$candidate" ]; then
              if git rev-parse --verify --quiet "refs/remotes/origin/HEAD^{commit}" >/dev/null 2>&1; then
                printf 'refs/remotes/origin/HEAD'
                return
              fi
              if git rev-parse --verify --quiet origin/master >/dev/null 2>&1; then
                printf 'origin/master'
                return
              fi
              if git rev-parse --verify --quiet origin/main >/dev/null 2>&1; then
                printf 'origin/main'
                return
              fi
              if git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master" >/dev/null 2>&1 && \
                 git rev-parse --verify --quiet "refs/remotes/origin/master^{commit}" >/dev/null 2>&1; then
                printf 'refs/remotes/origin/master'
                return
              fi
              if git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main" >/dev/null 2>&1 && \
                 git rev-parse --verify --quiet "refs/remotes/origin/main^{commit}" >/dev/null 2>&1; then
                printf 'refs/remotes/origin/main'
                return
              fi
              echo "::error::Unable to resolve default base branch on origin" >&2
              exit 1
            fi

            case "$candidate" in
              -*|^*|*..*|*[[:space:]]*|*:*|*\\*)
                echo "::error::Invalid ${role} value: $candidate" >&2
                exit 1
                ;;
            esac

            local stripped_head="${candidate#refs/heads/}"
            if [ "$prefer_origin" = "1" ]; then
              if git rev-parse --verify --quiet "origin/${stripped_head}^{commit}" >/dev/null 2>&1; then
                printf 'origin/%s' "$stripped_head"
                return
              fi
              if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null 2>&1; then
                printf '%s' "$candidate"
                return
              fi
            else
              if git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null 2>&1; then
                printf '%s' "$candidate"
                return
              fi
              if git rev-parse --verify --quiet "origin/${stripped_head}^{commit}" >/dev/null 2>&1; then
                printf 'origin/%s' "$stripped_head"
                return
              fi
            fi

            # On-demand inert git object fetch (never checks out untrusted files) for unfetched SHAs, branches, or tags.
            if printf '%s' "$candidate" | grep -Eq '^[0-9a-fA-F]{40,64}$'; then
              if git fetch --no-tags origin "$candidate" >/dev/null 2>&1 && \
                 git rev-parse --verify --quiet "${candidate}^{commit}" >/dev/null 2>&1; then
                printf '%s' "$candidate"
                return
              fi
            else
              local clean_branch="${candidate#refs/remotes/origin/}"
              clean_branch="${clean_branch#origin/}"
              clean_branch="${clean_branch#refs/heads/}"
              if [ -n "$clean_branch" ] && \
                 git check-ref-format --branch "$clean_branch" >/dev/null 2>&1 && \
                 git fetch --no-tags origin "+refs/heads/${clean_branch}:refs/remotes/origin/${clean_branch}" >/dev/null 2>&1 && \
                 git rev-parse --verify --quiet "refs/remotes/origin/${clean_branch}^{commit}" >/dev/null 2>&1; then
                printf 'refs/remotes/origin/%s' "$clean_branch"
                return
              fi
              local clean_tag="${candidate#refs/tags/}"
              if [ -n "$clean_tag" ] && \
                 git check-ref-format "refs/tags/${clean_tag}" >/dev/null 2>&1 && \
                 git fetch --no-tags origin "+refs/tags/${clean_tag}:refs/remotes/origin/tags/${clean_tag}" >/dev/null 2>&1 && \
                 git rev-parse --verify --quiet "refs/remotes/origin/tags/${clean_tag}^{commit}" >/dev/null 2>&1; then
                printf 'refs/remotes/origin/tags/%s' "$clean_tag"
                return
              fi
            fi

            echo "::error::Unable to resolve ${role} '${candidate}' locally or on origin" >&2
            exit 1
          }

          if [ -n "${PR_NUMBER:-}" ]; then
            if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'; then
              echo "::error::Invalid pr_number '${PR_NUMBER}' (expected positive integer)"
              exit 1
            fi
            PR_TRACKING_REF="refs/remotes/origin/pr/${PR_NUMBER}"
            # Fetch only git objects for refs/pull/<n>/head; never check out untrusted PR files.
            git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:${PR_TRACKING_REF}"
            START_REF="$(resolve_git_target "BASE_REF" "${BASE_REF:-}" "1")"
            git diff --no-ext-diff --no-color "${START_REF}...${PR_TRACKING_REF}" -- > "$DIFF_PATH"
          elif [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ] && \
               git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null && \
               git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            git diff --no-ext-diff --no-color "${BASE_SHA}...${HEAD_SHA}" -- > "$DIFF_PATH"
          else
            START_REF="$(resolve_git_target "BASE_REF" "${BASE_REF:-}" "1")"
            END_CANDIDATE="${HEAD_REF:-HEAD}"
            END_REF="$(resolve_git_target "HEAD_REF" "$END_CANDIDATE" "0")"
            git diff --no-ext-diff --no-color "${START_REF}...${END_REF}" -- > "$DIFF_PATH"
          fi
          echo "Generated PR diff at $DIFF_PATH ($(wc -c < "$DIFF_PATH") bytes)"

      # --- Stage 3: run_reviewer (allow_failure; gate enforced in report_verdict) ---
      - name: Run Trimurti AI Reviewer
        id: run_reviewer
        timeout-minutes: 45
        continue-on-error: true
        env:
          REVIEWER_TOTAL_TIMEOUT_MS: "2400000"
        run: |
          set -euo pipefail
          WORK_DIR="${REVIEW_DIR:-/tmp/gemini}"
          node scripts/reviewer.js "$WORK_DIR/pr26.diff" "$WORK_DIR/review_result.json"

      # --- Component 4: Artifact Retention ---
      - name: Upload review verdict artifact
        if: always() && !cancelled()
        uses: actions/upload-artifact@v6
        with:
          name: ai-review-verdict
          path: ${{ env.REVIEW_DIR }}/review_result.json
          retention-days: 30
          if-no-files-found: ignore

      # --- Stage 4: report_verdict & Component 3: Exit Code Rules & Pass/Fail Gates ---
      - name: Record review summary
        id: record_verdict
        if: always() && !cancelled()
        env:
          REVIEWER_OUTCOME: ${{ steps.run_reviewer.outcome }}
        run: |
          set -euo pipefail
          WORK_DIR="${REVIEW_DIR:-/tmp/gemini}"
          RESULT_PATH="${REVIEW_OUTPUT_PATH:-$WORK_DIR/review_result.json}"

          RESULT_PATH="$RESULT_PATH" REVIEWER_OUTCOME="${REVIEWER_OUTCOME:-}" node -e '
            const fs = require("fs");

            function escCommandData(val) {
              return String(val ?? "")
                .replace(/%/g, "%25")
                .replace(/\r/g, "%0D")
                .replace(/\n/g, "%0A");
            }

            function escCommandProp(val) {
              return escCommandData(val)
                .replace(/:/g, "%3A")
                .replace(/,/g, "%2C");
            }

            function singleLine(val) {
              return String(val ?? "")
                .replace(/\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b\[[0-9;?]*[ -/]*[@-~]/g, "")
                .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g, " ")
                .replace(/[\r\n]+/g, " ")
                .trim();
            }

            const resultPath = process.env.RESULT_PATH;
            const outcome = singleLine(process.env.REVIEWER_OUTCOME);

            let data = null;
            let parseErr = null;
            if (resultPath && fs.existsSync(resultPath)) {
              try {
                if (fs.lstatSync(resultPath).isSymbolicLink()) {
                  throw new Error("Refusing symlinked review_result.json");
                }
                data = JSON.parse(fs.readFileSync(resultPath, "utf8").replace(/^\uFEFF/, ""));
              } catch (err) {
                parseErr = err;
              }
            }

            let verdict = "ERROR";
            let summary = "";
            let cleanIssues = [];
            let totalIssuesCount = 0;

            if (data && typeof data === "object" && !Array.isArray(data)) {
              const rawVerdict = singleLine(data.verdict || "");
              const rawSummary = typeof data.summary === "string" ? singleLine(data.summary).slice(0, 500) : "";
              const hasIssuesArray = Array.isArray(data.issues);

              if (hasIssuesArray) {
                totalIssuesCount = data.issues.length;
                for (const item of data.issues.slice(0, 25)) {
                  if (!item || typeof item !== "object" || Array.isArray(item)) continue;
                  const file = typeof item.file === "string" ? singleLine(item.file).slice(0, 500) : "";
                  const message = typeof item.message === "string" ? singleLine(item.message).slice(0, 300) : "";
                  if (!file || !message) continue;
                  const entry = { file, message };
                  if (typeof item.line === "number" && Number.isInteger(item.line) && item.line >= 1) {
                    entry.line = item.line;
                  }
                  cleanIssues.push(entry);
                }
              }

              if (
                (rawVerdict !== "APPROVE" && rawVerdict !== "REQUEST_CHANGES") ||
                !rawSummary ||
                !hasIssuesArray
              ) {
                verdict = "ERROR";
                summary = rawSummary
                  ? `Invalid review_result.json schema (verdict="${rawVerdict || "missing"}"): ${rawSummary}`.slice(0, 500)
                  : `Invalid review_result.json schema (verdict="${rawVerdict || "missing"}", missing summary or issues array).`;
              } else {
                verdict = rawVerdict;
                summary = rawSummary;
                if (verdict === "APPROVE" && (totalIssuesCount > 0 || cleanIssues.length > 0)) {
                  verdict = "REQUEST_CHANGES";
                }
                if (verdict === "REQUEST_CHANGES" && cleanIssues.length === 0) {
                  verdict = "ERROR";
                  summary = `Invalid REQUEST_CHANGES payload without valid issues: ${summary}`.slice(0, 500);
                }
                if (verdict === "APPROVE" && outcome !== "success") {
                  verdict = "ERROR";
                  const shownOutcome = outcome || "missing";
                  summary = `${summary} (reviewer step outcome was "${shownOutcome}", expected "success")`.slice(0, 500);
                }
              }
            } else if (parseErr) {
              verdict = "ERROR";
              summary = `Invalid JSON in ${resultPath}: ${singleLine(parseErr.message)}`.slice(0, 500);
            } else {
              verdict = "ERROR";
              summary =
                outcome === "skipped"
                  ? "Trimurti AI Reviewer pipeline failed in an earlier prerequisite/diff step before review execution."
                  : "Trimurti AI Reviewer failed closed before writing review_result.json (ensure agy CLI and included-allowance OAuth are available on the runner).";
            }

            const issuesJson = JSON.stringify(cleanIssues).replace(/[\r\n]+/g, " ");

            if (process.env.GITHUB_OUTPUT) {
              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                `verdict=${verdict}\nsummary=${summary}\nissues_json=${issuesJson}\n`,
                "utf8"
              );
            }

            if (process.env.GITHUB_STEP_SUMMARY) {
              const safeSlice = (str, maxLen) => {
                if (str.length <= maxLen) return str;
                const cut = str.slice(0, maxLen);
                const last = cut.charCodeAt(cut.length - 1);
                return last >= 0xd800 && last <= 0xdbff ? cut.slice(0, -1) : cut;
              };
              const stripMentions = (val) => {
                let cur = String(val ?? "").replace(
                  /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g,
                  " "
                );
                while (true) {
                  const next = cur
                    .replace(/<![^>]*>/g, "")
                    .replace(/<[@#][^>]*>/g, "")
                    .replace(/@(?:channel|here|everyone)\b/gi, "")
                    .replace(/(^|[^A-Za-z0-9_.\/-])@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/g, "$1")
                    .replace(/^@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/, "");
                  if (next === cur) break;
                  cur = next;
                }
                return cur.replace(/@(?=[A-Za-z0-9_])/g, "(at)").replace(/\s+/g, " ").trim();
              };
              const safeMdInline = (val, maxLen = 500) =>
                safeSlice(stripMentions(val), maxLen)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;")
                  .replace(/\\/g, "\\\\")
                  .replace(/`/g, "\x27")
                  .replace(/\[/g, "\\[")
                  .replace(/\]/g, "\\]")
                  .replace(/!(?=\\\[)/g, "\\!")
                  .replace(/\|/g, "\\|");
              const lines = [
                `### Trimurti AI Review: ${verdict}`,
                "",
                "> **AI-generated advisory output.** Unverified model output; verify findings against the pull request diff.",
                "",
                safeMdInline(summary, 500) || "No summary provided.",
              ];
              if (cleanIssues.length > 0) {
                lines.push("", "#### Issues (AI-generated, unverified)", "");
                for (const issue of cleanIssues) {
                  const rawLoc = issue.line ? `${issue.file}:${issue.line}` : issue.file;
                  const loc = safeMdInline(rawLoc, 520);
                  const msg = safeMdInline(issue.message, 300);
                  lines.push(`- \`${loc}\`: ${msg}`);
                }
                if (totalIssuesCount > cleanIssues.length) {
                  lines.push("", `_Showing first ${cleanIssues.length} of ${totalIssuesCount} issues._`);
                }
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n", "utf8");
            }

            if (verdict === "APPROVE" && cleanIssues.length === 0 && outcome === "success") {
              console.log(
                `::notice title=Trimurti AI Review (APPROVE)::${escCommandData(summary || "Approved.")}`
              );
              process.exit(0);
            }

            for (const issue of cleanIssues) {
              const props = [`file=${escCommandProp(issue.file)}`];
              if (issue.line) {
                props.push(`line=${issue.line}`);
              }
              props.push("title=Trimurti AI Reviewer");
              console.log(`::error ${props.join(",")}::${escCommandData(issue.message)}`);
            }

            if (cleanIssues.length === 0) {
              console.log(
                `::error title=Trimurti AI Review (${escCommandProp(verdict)})::${escCommandData(
                  summary || "AI review failed closed."
                )}`
              );
            }

            process.exit(1);
          '

  # --- Component 4: Schema Mapping & Native Webhook / Alert Delivery ---
  notify_failure:
    name: Notify on Review Failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only execute when report_verdict finishes with an actual failure (not cancellation)
    needs: [report_verdict]
    if: failure() && needs.report_verdict.result == 'failure'
    steps:
      - name: Send Notifications
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TRIMURTI_WEBHOOK_URL: ${{ secrets.TRIMURTI_WEBHOOK_URL }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || vars.EMAIL_TO || 'sanjay@kapoors.com' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM || vars.EMAIL_FROM || 'info@kapoors.com' }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number || '' }}
          PR_URL: ${{ github.event.pull_request.html_url || (inputs.pr_number && format('{0}/{1}/pull/{2}', github.server_url, github.repository, inputs.pr_number)) || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
          REPO_FULL_NAME: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_VERDICT: ${{ needs.report_verdict.outputs.verdict }}
          REVIEW_SUMMARY: ${{ needs.report_verdict.outputs.summary }}
          REVIEW_ISSUES_JSON: ${{ needs.report_verdict.outputs.issues_json }}
        run: |
          set -euo pipefail
          echo "Pipeline failed. Sending notifications..."

          umask 077
          TMP_CURL_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_CURL_DIR"' EXIT

          SLACK_URL_CLEAN="$(printf '%s' "${SLACK_WEBHOOK_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          TRIMURTI_URL_CLEAN="$(printf '%s' "${TRIMURTI_WEBHOOK_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          EMAIL_KEY_CLEAN="$(printf '%s' "${EMAIL_API_KEY:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          GH_TOKEN_CLEAN="$(printf '%s' "${GITHUB_TOKEN:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          GH_API_CLEAN="$(printf '%s' "${GITHUB_API_URL:-}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's|/*$||')"
          SENDGRID_API_URL="${SENDGRID_API_URL:-https://api.sendgrid.com/v3/mail/send}"

          # Strictly validate PR_NUMBER and PR_URL so malformed workflow_dispatch inputs
          # that failed diff generation cannot inject newlines, Slack mentions, or bad URLs.
          RAW_PR_NUM="$(printf '%s' "${PR_NUMBER:-}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if printf '%s' "$RAW_PR_NUM" | grep -Eq '^[1-9][0-9]*$'; then
            export PR_NUMBER="$RAW_PR_NUM"
          else
            export PR_NUMBER=""
            export PR_URL=""
          fi
          if [ -n "${PR_URL:-}" ]; then
            if ! printf '%s' "$PR_URL" | grep -Eq '^https://[^[:space:]<>|"`'\'']+$'; then
              export PR_URL=""
            fi
          fi

          # Under workflow_dispatch, github.event.pull_request.title is empty; resolve PR title
          # (and canonical html_url if absent) from GitHub REST API when PR_NUMBER is valid.
          if [ -z "${PR_TITLE:-}" ] && [ -n "${PR_NUMBER:-}" ] && [ -n "$GH_API_CLEAN" ] && \
             printf '%s' "$GH_API_CLEAN" | grep -Eq '^https://[^[:space:]<>|"`'\'']+$' && \
             ( [ -n "$TRIMURTI_URL_CLEAN" ] || [ -n "$SLACK_URL_CLEAN" ] || [ -n "$EMAIL_KEY_CLEAN" ] ) && \
             printf '%s' "${REPO_FULL_NAME:-}" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            PR_META_CFG="$TMP_CURL_DIR/gh_pr.cfg"
            PR_META_JSON="$TMP_CURL_DIR/gh_pr.json"
            GH_PR_API_ENDPOINT="${GH_API_CLEAN}/repos/${REPO_FULL_NAME}/pulls/${PR_NUMBER}"
            GH_PR_API_ENDPOINT="$GH_PR_API_ENDPOINT" GH_TOKEN_CLEAN="$GH_TOKEN_CLEAN" PR_META_CFG="$PR_META_CFG" node -e '
              const fs = require("fs");
              const lines = [
                `url = ${JSON.stringify(process.env.GH_PR_API_ENDPOINT)}`,
                `header = "Accept: application/vnd.github+json"`,
                `header = "X-GitHub-Api-Version: 2022-11-28"`,
              ];
              if (process.env.GH_TOKEN_CLEAN) {
                lines.push(`header = ${JSON.stringify("Authorization: Bearer " + process.env.GH_TOKEN_CLEAN)}`);
              }
              fs.writeFileSync(process.env.PR_META_CFG, lines.join("\n") + "\n", "utf8");
            '
            if curl --proto '=https' --tlsv1.2 -fsS --max-time 10 \
              --config "$PR_META_CFG" \
              --output "$PR_META_JSON" 2>/dev/null; then
              RESOLVED_PR_ENV="$TMP_CURL_DIR/gh_pr_resolved.txt"
              PR_META_JSON="$PR_META_JSON" RESOLVED_PR_ENV="$RESOLVED_PR_ENV" node -e '
                const fs = require("fs");
                try {
                  const data = JSON.parse(fs.readFileSync(process.env.PR_META_JSON, "utf8"));
                  const cleanLine = (v) =>
                    typeof v === "string"
                      ? v
                          .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g, " ")
                          .trim()
                          .slice(0, 300)
                      : "";
                  const title = cleanLine(data && data.title);
                  const htmlUrl =
                    data && typeof data.html_url === "string" && /^https:\/\/[^\s<>|"\x27`]+$/.test(data.html_url.trim())
                      ? data.html_url.trim()
                      : "";
                  fs.writeFileSync(process.env.RESOLVED_PR_ENV, JSON.stringify({ title, htmlUrl }), "utf8");
                } catch (_) {}
              '
              if [ -f "$RESOLVED_PR_ENV" ]; then
                PR_TITLE="$(RESOLVED_PR_ENV="$RESOLVED_PR_ENV" node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.RESOLVED_PR_ENV,"utf8")); process.stdout.write(d.title||"");')"
                export PR_TITLE
                if [ -z "${PR_URL:-}" ]; then
                  PR_URL="$(RESOLVED_PR_ENV="$RESOLVED_PR_ENV" node -e 'const d=JSON.parse(require("fs").readFileSync(process.env.RESOLVED_PR_ENV,"utf8")); process.stdout.write(d.htmlUrl||"");')"
                  export PR_URL
                fi
              fi
            fi
          fi

          notify_rc=0
          configured_count=0

          # --- Trimurti Native Webhook Schema Mapping (optional) ---
          if [ -n "$TRIMURTI_URL_CLEAN" ]; then
            configured_count=$((configured_count + 1))
            TRIMURTI_CFG="$TMP_CURL_DIR/trimurti.cfg"
            TRIMURTI_BODY="$TMP_CURL_DIR/trimurti.json"
            TRIMURTI_URL_CLEAN="$TRIMURTI_URL_CLEAN" TRIMURTI_CFG="$TRIMURTI_CFG" TRIMURTI_BODY="$TRIMURTI_BODY" node -e '
              const fs = require("fs");
              const safeSlice = (str, maxLen) => {
                if (str.length <= maxLen) return str;
                const cut = str.slice(0, maxLen);
                const last = cut.charCodeAt(cut.length - 1);
                return last >= 0xd800 && last <= 0xdbff ? cut.slice(0, -1) : cut;
              };
              const stripMentions = (val) => {
                let cur = String(val ?? "").replace(
                  /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g,
                  " "
                );
                while (true) {
                  const next = cur
                    .replace(/<![^>]*>/g, "")
                    .replace(/<[@#][^>]*>/g, "")
                    .replace(/@(?:channel|here|everyone)\b/gi, "")
                    .replace(/(^|[^A-Za-z0-9_.\/-])@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/g, "$1")
                    .replace(/^@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/, "");
                  if (next === cur) break;
                  cur = next;
                }
                return cur.replace(/@(?=[A-Za-z0-9_])/g, "(at)").replace(/\s+/g, " ").trim();
              };
              const cleanSingleLine = (val, maxLen = 500) =>
                safeSlice(stripMentions(val), maxLen)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
              let issues = [];
              try {
                const parsed = JSON.parse(process.env.REVIEW_ISSUES_JSON || "[]");
                if (Array.isArray(parsed)) {
                  issues = parsed
                    .filter((it) => it && typeof it === "object" && !Array.isArray(it))
                    .slice(0, 25)
                    .map((it) => {
                      const out = {
                        file: cleanSingleLine(it.file || "unknown", 500) || "unknown",
                        message: cleanSingleLine(it.message || "", 300),
                      };
                      if (typeof it.line === "number" && Number.isInteger(it.line) && it.line >= 1) {
                        out.line = it.line;
                      }
                      return out;
                    })
                    .filter((it) => Boolean(it.message));
                }
              } catch (_) {}
              const rawVerdict = stripMentions(process.env.REVIEW_VERDICT || "").slice(0, 64);
              const verdict = rawVerdict === "REQUEST_CHANGES" || rawVerdict === "ERROR" ? rawVerdict : "ERROR";
              const defaultSummary =
                verdict === "REQUEST_CHANGES"
                  ? "The AI Reviewer requested changes."
                  : "The Trimurti AI Reviewer pipeline failed closed before producing a review verdict.";
              const prNumStr = /^\d+$/.test(process.env.PR_NUMBER || "") ? process.env.PR_NUMBER : "";
              const safeUrl = (u) =>
                typeof u === "string" && /^https:\/\/[^\s<>|"\x27`]+$/.test(u.trim()) ? u.trim() : "";
              const payload = {
                schema: "trimurti.ai_review.v1",
                ai_generated: true,
                advisory: true,
                notice: "AI-generated advisory output. Unverified model output; verify findings against the PR diff.",
                verdict,
                summary: cleanSingleLine(process.env.REVIEW_SUMMARY || "", 500) || defaultSummary,
                issues,
                repository: cleanSingleLine(process.env.REPO_FULL_NAME || "kapoorgalleries/metaplex", 200),
                pull_request: {
                  number: prNumStr ? Number(prNumStr) : null,
                  title: cleanSingleLine(process.env.PR_TITLE || "", 300),
                  url: safeUrl(process.env.PR_URL),
                },
                workflow_run_url: safeUrl(process.env.RUN_URL),
              };
              fs.writeFileSync(process.env.TRIMURTI_BODY, JSON.stringify(payload), "utf8");
              fs.writeFileSync(
                process.env.TRIMURTI_CFG,
                `url = ${JSON.stringify(process.env.TRIMURTI_URL_CLEAN)}\nheader = "Content-Type: application/json"\n`,
                "utf8"
              );
            '
            if ! curl --proto '=https' --tlsv1.2 -fsS --max-time 30 \
              --request POST \
              --config "$TRIMURTI_CFG" \
              --data-binary "@$TRIMURTI_BODY" >/dev/null; then
              echo "::error::Failed to send Trimurti webhook notification."
              notify_rc=1
            else
              echo "Trimurti webhook notification sent."
            fi
          fi

          # --- Slack Notification ---
          if [ -n "$SLACK_URL_CLEAN" ]; then
            configured_count=$((configured_count + 1))
            SLACK_CFG="$TMP_CURL_DIR/slack.cfg"
            SLACK_BODY="$TMP_CURL_DIR/slack.json"
            SLACK_URL_CLEAN="$SLACK_URL_CLEAN" SLACK_CFG="$SLACK_CFG" SLACK_BODY="$SLACK_BODY" node -e '
              const fs = require("fs");
              const safeSlice = (str, maxLen) => {
                if (str.length <= maxLen) return str;
                const cut = str.slice(0, maxLen);
                const last = cut.charCodeAt(cut.length - 1);
                return last >= 0xd800 && last <= 0xdbff ? cut.slice(0, -1) : cut;
              };
              const stripMentions = (val) => {
                let cur = String(val ?? "").replace(
                  /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g,
                  " "
                );
                while (true) {
                  const next = cur
                    .replace(/<![^>]*>/g, "")
                    .replace(/<[@#][^>]*>/g, "")
                    .replace(/@(?:channel|here|everyone)\b/gi, "")
                    .replace(/(^|[^A-Za-z0-9_.\/-])@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/g, "$1")
                    .replace(/^@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/, "");
                  if (next === cur) break;
                  cur = next;
                }
                return cur.replace(/@(?=[A-Za-z0-9_])/g, "(at)").replace(/\s+/g, " ").trim();
              };
              const escSlackMrkdwn = (val, maxLen = 500) =>
                safeSlice(stripMentions(val), maxLen)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
              const safeUrl = (u) =>
                typeof u === "string" && /^https:\/\/[^\s<>|"\x27`]+$/.test(u.trim())
                  ? u.trim().replace(/&/g, "&amp;")
                  : "";
              const num = /^[1-9][0-9]*$/.test(process.env.PR_NUMBER || "") ? process.env.PR_NUMBER : "?";
              const title = escSlackMrkdwn(process.env.PR_TITLE || "", 300);
              const repo = escSlackMrkdwn(process.env.REPO_FULL_NAME || "kapoorgalleries/metaplex", 200);
              const prUrl = safeUrl(process.env.PR_URL);
              const runUrl = safeUrl(process.env.RUN_URL);
              const rawVerdict = stripMentions(process.env.REVIEW_VERDICT || "").slice(0, 64);
              const verdict = rawVerdict === "REQUEST_CHANGES" || rawVerdict === "ERROR" ? rawVerdict : "ERROR";
              const defaultSummary =
                verdict === "REQUEST_CHANGES"
                  ? "The AI Reviewer requested changes."
                  : "The Trimurti AI Reviewer pipeline failed closed before producing a review verdict.";
              const summary = escSlackMrkdwn(process.env.REVIEW_SUMMARY || "", 500) || defaultSummary;
              let issues = [];
              try {
                const parsed = JSON.parse(process.env.REVIEW_ISSUES_JSON || "[]");
                if (Array.isArray(parsed)) {
                  issues = parsed.filter((it) => it && typeof it === "object" && !Array.isArray(it));
                }
              } catch (_) {}
              const issueLines = issues.slice(0, 10).map((issue) => {
                const rawLoc = issue.line
                  ? `${issue.file || "unknown"}:${issue.line}`
                  : String(issue.file || "unknown");
                const loc = escSlackMrkdwn(rawLoc, 520).replace(/`/g, "\x27");
                const msg = escSlackMrkdwn(issue.message || "", 300);
                return `• \`${loc}\`: ${msg}`;
              });
              if (issues.length > 10) {
                issueLines.push(`• ...and ${issues.length - 10} additional issue(s)`);
              }
              const lines = [
                `🚨 *AI PR Review Failed!* (${repo} #${num})`,
                "_AI-generated advisory output; verify findings against the PR diff._",
                title ? `PR: ${title}` : null,
                `Verdict: \`${verdict}\``,
                `Summary (AI-generated): ${summary}`,
                issueLines.length > 0 ? `Issues (AI-generated):\n${issueLines.join("\n")}` : null,
                prUrl ? `View details here: ${prUrl}` : null,
                runUrl ? `Workflow run: ${runUrl}` : null,
              ].filter(Boolean);
              fs.writeFileSync(
                process.env.SLACK_BODY,
                JSON.stringify({
                  text: lines.join("\n"),
                  unfurl_links: false,
                  unfurl_media: false,
                }),
                "utf8"
              );
              fs.writeFileSync(
                process.env.SLACK_CFG,
                `url = ${JSON.stringify(process.env.SLACK_URL_CLEAN)}\nheader = "Content-Type: application/json"\n`,
                "utf8"
              );
            '
            if ! curl --proto '=https' --tlsv1.2 -fsS --max-time 30 \
              --request POST \
              --config "$SLACK_CFG" \
              --data-binary "@$SLACK_BODY" >/dev/null; then
              echo "::error::Failed to send Slack notification."
              notify_rc=1
            else
              echo "Slack notification sent."
            fi
          else
            echo "::warning::SLACK_WEBHOOK_URL secret is not configured; skipping Slack notification."
          fi

          # --- Email Notification (SendGrid v3 API) ---
          if [ -n "$EMAIL_KEY_CLEAN" ]; then
            configured_count=$((configured_count + 1))
            EMAIL_CFG="$TMP_CURL_DIR/email.cfg"
            EMAIL_BODY="$TMP_CURL_DIR/email.json"
            EMAIL_KEY_CLEAN="$EMAIL_KEY_CLEAN" SENDGRID_API_URL="$SENDGRID_API_URL" EMAIL_CFG="$EMAIL_CFG" EMAIL_BODY="$EMAIL_BODY" node -e '
              const fs = require("fs");
              const safeSlice = (str, maxLen) => {
                if (str.length <= maxLen) return str;
                const cut = str.slice(0, maxLen);
                const last = cut.charCodeAt(cut.length - 1);
                return last >= 0xd800 && last <= 0xdbff ? cut.slice(0, -1) : cut;
              };
              const cleanRaw = (val, maxLen = 500) =>
                safeSlice(
                  String(val ?? "")
                    .replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g, " ")
                    .trim(),
                  maxLen
                );
              const stripEmailMentions = (val) => {
                let cur = String(val ?? "").replace(
                  /[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u202a-\u202e\u2066-\u2069\ufeff]+/g,
                  " "
                );
                while (true) {
                  const next = cur
                    .replace(/<![^>]*>/g, "")
                    .replace(/<[@#][^>]*>/g, "")
                    .replace(/@(?:channel|here|everyone)\b/gi, "")
                    .replace(/(^|[^A-Za-z0-9_.\/-])@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/g, "$1")
                    .replace(/^@[A-Za-z0-9_][A-Za-z0-9_.\/-]*/, "");
                  if (next === cur) break;
                  cur = next;
                }
                return cur
                  .replace(/@(?=[A-Za-z0-9_])/g, "(at)")
                  .replace(/\s+/g, " ")
                  .trim();
              };
              const sanitizeEmailText = (val, maxLen = 500) =>
                safeSlice(stripEmailMentions(val), maxLen)
                  .replace(/&/g, "&amp;")
                  .replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;");
              const safeUrl = (u) =>
                typeof u === "string" && /^https:\/\/[^\s<>|"\x27`]+$/.test(u.trim()) ? u.trim() : "";
              const num = /^[1-9][0-9]*$/.test(process.env.PR_NUMBER || "") ? process.env.PR_NUMBER : "?";
              const title = sanitizeEmailText(process.env.PR_TITLE || "", 300);
              const subjectTitle = sanitizeEmailText(process.env.PR_TITLE || "", 80);
              const repo = sanitizeEmailText(process.env.REPO_FULL_NAME || "kapoorgalleries/metaplex", 200);
              const prUrl = safeUrl(process.env.PR_URL);
              const runUrl = safeUrl(process.env.RUN_URL);
              const rawVerdict = cleanRaw(process.env.REVIEW_VERDICT || "", 64);
              const verdict = rawVerdict === "REQUEST_CHANGES" || rawVerdict === "ERROR" ? rawVerdict : "ERROR";
              const defaultSummary =
                verdict === "REQUEST_CHANGES"
                  ? "The AI Reviewer requested changes."
                  : "The Trimurti AI Reviewer pipeline failed closed before producing a review verdict.";
              const summary = sanitizeEmailText(process.env.REVIEW_SUMMARY || "", 500) || defaultSummary;
              let issues = [];
              try {
                const parsed = JSON.parse(process.env.REVIEW_ISSUES_JSON || "[]");
                if (Array.isArray(parsed)) issues = parsed;
              } catch (_) {}
              const seen = new Set();
              const toList = (process.env.EMAIL_TO || "sanjay@kapoors.com")
                .split(",")
                .map((s) => cleanRaw(s, 254))
                .filter((s) => {
                  if (!s || !/^[^\s@<>,;"\x27()\[\]\\]+@[^\s@<>,;"\x27()\[\]\\]+\.[^\s@<>,;"\x27()\[\]\\]+$/.test(s)) {
                    return false;
                  }
                  const low = s.toLowerCase();
                  if (seen.has(low)) return false;
                  seen.add(low);
                  return true;
                })
                .map((email) => ({ email }));
              if (toList.length === 0) {
                toList.push({ email: "sanjay@kapoors.com" });
              }
              const rawFrom = cleanRaw(process.env.EMAIL_FROM || "info@kapoors.com", 254);
              const fromEmail =
                /^[^\s@<>,;"\x27()\[\]\\]+@[^\s@<>,;"\x27()\[\]\\]+\.[^\s@<>,;"\x27()\[\]\\]+$/.test(rawFrom)
                  ? rawFrom
                  : "info@kapoors.com";
              const bodyLines = [
                `The Trimurti AI Reviewer failed on ${repo} Pull Request #${num}.`,
                "AI-generated advisory output. Unverified model output; verify findings against the PR diff.",
                title ? `Title: ${title}` : null,
                `Verdict: ${verdict}`,
                "",
                `Summary (AI-generated): ${summary}`,
              ];
              if (issues.length > 0) {
                bodyLines.push("", "Issues (AI-generated, unverified):");
                for (const issue of issues) {
                  if (!issue || typeof issue !== "object") continue;
                  const rawLoc = issue.line ? `${issue.file || "unknown"}:${issue.line}` : String(issue.file || "unknown");
                  bodyLines.push(`- ${sanitizeEmailText(rawLoc, 520)}: ${sanitizeEmailText(issue.message || "", 300)}`);
                }
              }
              bodyLines.push(
                "",
                prUrl ? `Pull Request: ${prUrl}` : null,
                runUrl ? `Workflow Run: ${runUrl}` : null
              );
              fs.writeFileSync(
                process.env.EMAIL_BODY,
                JSON.stringify({
                  personalizations: [{ to: toList }],
                  from: { email: fromEmail, name: "Kapoor Galleries CI" },
                  subject: `Build Failed: PR #${num}${subjectTitle ? " - " + subjectTitle : ""}`,
                  content: [{ type: "text/plain", value: bodyLines.filter((v) => v !== null).join("\n") }],
                }),
                "utf8"
              );
              fs.writeFileSync(
                process.env.EMAIL_CFG,
                [
                  `url = ${JSON.stringify(process.env.SENDGRID_API_URL)}`,
                  `header = ${JSON.stringify("Authorization: Bearer " + process.env.EMAIL_KEY_CLEAN)}`,
                  `header = "Content-Type: application/json"`,
                  "",
                ].join("\n"),
                "utf8"
              );
            '
            if ! curl --proto '=https' --tlsv1.2 -fsS --max-time 30 \
              --request POST \
              --config "$EMAIL_CFG" \
              --data-binary "@$EMAIL_BODY" >/dev/null; then
              echo "::error::Failed to send SendGrid email notification."
              notify_rc=1
            else
              echo "Email notification sent."
            fi
          else
            echo "::warning::EMAIL_API_KEY secret is not configured; skipping email notification."
          fi

          if [ "$configured_count" -eq 0 ]; then
            echo "::warning::Neither SLACK_WEBHOOK_URL, TRIMURTI_WEBHOOK_URL, nor EMAIL_API_KEY is configured; no external notifications were sent."
          fi

          exit "$notify_rc"
