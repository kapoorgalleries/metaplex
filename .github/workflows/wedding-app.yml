name: Wedding App

# CI for the wedding app (wedding-app/). It validates the source, builds a
# clean deploy artifact, scans it, serves it, smoke-tests the static site, and
# uploads the exact dist that would be deployed — separately from a backend
# boot check. It does NOT touch or bundle the Metaplex storefront build.
# (The Rust suite in pull-request.yml is scoped to rust/ and does not gate
# wedding-app-only PRs.)
on:
  pull_request:
    paths:
      - "wedding-app/**"
      - ".github/workflows/wedding-app.yml"
  push:
    branches: [master]
    paths:
      - "wedding-app/**"
      - ".github/workflows/wedding-app.yml"
  workflow_dispatch:

jobs:
  static:
    name: Build, scan & smoke-test the static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wedding-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wedding-app/package-lock.json

      - name: Install (reproducible)
        run: npm ci

      - name: Validate source
        run: npm run validate

      - name: Build clean dist
        run: npm run build

      - name: Scan dist for excluded/sensitive files
        run: npm run scan

      - name: Serve dist & smoke-test pages
        run: npm run smoke

      - name: Upload deploy artifact (exact dist/)
        uses: actions/upload-artifact@v4
        with:
          name: wedding-app-dist
          path: wedding-app/dist
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend boot & no-secret API smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./wedding-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: wedding-app/server/package-lock.json

      - name: Install server dependencies (reproducible)
        run: npm --prefix server ci

      - name: Boot the API and check secret-free endpoints
        # No ANTHROPIC_API_KEY / ADMIN_PASSWORD / S3 creds are set: AI, admin and
        # cloud storage stay disabled. This only proves the server boots and its
        # endpoints that don't require secrets respond — NOT that concierge,
        # push, photo-moderation or email work end to end (those need a secret'd
        # environment; see DEPLOY.md).
        run: |
          node server/server.js &
          SRV=$!
          for i in 1 2 3 4 5 6 7 8; do curl -fsS http://localhost:8080/api/stats >/dev/null 2>&1 && break; sleep 1; done
          echo "Checking secret-free API endpoints…"
          curl -fsS http://localhost:8080/api/stats        | grep -q '"guests"'   && echo "  ✓ GET  /api/stats"
          curl -fsS http://localhost:8080/api/concierge    | grep -q '"available"'&& echo "  ✓ GET  /api/concierge (available:false without a key)"
          curl -fsS http://localhost:8080/api/push/key     >/dev/null             && echo "  ✓ GET  /api/push/key"
          curl -fsS -X POST http://localhost:8080/api/rsvp -H 'Content-Type: application/json' \
            -d '{"name":"CI Test","email":"ci@example.com","attending":"yes","guests":2}' | grep -q '"ok":true' \
            && echo "  ✓ POST /api/rsvp (persistence layer)"
          curl -fsS http://localhost:8080/api/rsvp/mine?email=ci@example.com | grep -q '"found":true' && echo "  ✓ GET  /api/rsvp/mine"
          kill $SRV
        env:
          PORT: "8080"
