# trimurti lab NAS: one share, user logins only, SMB2 and newer, signing required.
[global]
   workgroup = WORKGROUP
   server string = DiskStation
   netbios name = NAS
   server role = standalone server
   security = user
   map to guest = never
   restrict anonymous = 2
   server min protocol = SMB2_02
   server signing = mandatory
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[gallery]
   comment = Gallery files
   path = /srv/gallery
   valid users = gallery
   read only = no
   guest ok = no
   browseable = yes
   create mask = 0664
   directory mask = 0775
